const DATA = {"1283459": {"article_text": "PHILOSOPHICAL\n\nTRANSACTIONS.\n\nDecember 27. 1675.\n\nNumb.1204\n\nThe CONTENTS.\n\nTen New Experiments, made and communicated by the Honourable Robert Boyle Esq., about the Weakened Spring and some un-observ'd Effects of the Air: Where occurr not only several Trials to discover, whether the Spring of the Air, as it may divers ways be increased, so may not by other ways than Cold or Dilatation be weaken'd; but also some odd Experiments to show the Change of Colors producible in some Solutions and Precipitations by the Operation of the Air. Some Experiments made in the Air-pump upon Plants; directed and tried by the same persons, mentioned'd in Numb.119. An Account of some Books: I,Francigifci Willughbeii de Midleton Armigeri, c Reg. Societate, O R N I T H O L O G I A L E L i b r i t r e s, c c. II, The Comparative Anatomy of the TRU NCKS of Plants, together with an Account of their VEGETATION groundeth thereupon, by Nehemiah Grew M. D. and Fellow of the R. Society. III. The ROYAL ALMANACK, c c. by N. Stevenson, one of his Majesties Gunners.\n\nNew Experiments about the weakened Spring and some un-observ'd Effects of the Air: Made and communicated by the Honourable Robert Boyle Esq.\n\nA s for the not yet communicated Trials that I made in procceeding my Design of discovering or observing some latent Qualities of the Air, I will not deny you some of them, as imperfect as they yet are, but will venture to fend them you, as my Notes or my Memory suggests them to me; not only, because without being completed they may be fit enough to countenance P p suspicion\n\n(s 4.68 )\n\nsuspiciones (for you know,that I do not call them so much as opinions,) but for a weightier inducement, to be told you at the end of this Paper.\n\nThe two chief things aimed at in the imperfect Attempts I now send you, were to discover ; first, whether, as some Corroptions of Bodies do in close Vessels increase the Spring of the Air ( as I long since noted them to do,) so some other Corroptions may not , by a contrary or some other way, weaken the Spring of the Air ; and. next, whether in some Solutions and Precipitations the Air on the account of some unobserved Quality may not be found to produce some Phænomena not yet taken notice of.\n\nIn order to each of these Enquiries,I shall mention a few Tryals, though without curiously sorting them , because sometimes in the same Experiment both those Attempts were jointly prosecuted. . You may remember that in some of my formerly published Try- and an odd Phenomenon of the Change of Color producible in solutions of Copper by the operation of the Air; I shall now add what further Phenomena my Memory or Notes suply me with,about the Subject of that and the like Experiments.\n\nExperiment the First.\n\nWe took filings of crude Copper, and put them into a Crystal Glass of a Conical shape, into which we poured some strong Spirit of Salt, (that was fitted for our peculiar purpose) to the height of about a fingers breadth above the Filings ; and then closing the Vessel with a Glass-stopple exquisitly fitted to it, we suf-f-ed it to continue unmoved in a Window for some days, till the liquor had both obtained a high and darkish brown colour by the solution of some of the Copper, and lost that colour again, growing clear like common water, (which is it self a someth- \" (actually \"phenomenon ;)\".\n\nand then taking out the stopple, (without shaking the liquor) and thereby giving acces- \" (actually \"acces-\"). we perce- \" (actually \"we perceive\"). d that the upper surface of the liquor did in a few minutes re-acquire a darkish brown colour, which penetra- \" (actually \"petna-\". and deeper and deeper, at the end of about a quarter of an hour the whole body of the liquor appear'd to be likewise tinged.\n\nThe Conical Glass being again well stopt, the Menstruum did again in very few daies let fall or otherwise lose its tinure ; which, the stopple being taken out, it re-gained as before. Nor were the only Tryals I made with the like successes for the main ; but\" \"after-\"\n\nafterwards being desirous by a further Trial to resolve a doubt I had, I kept the Glafs yet longer in the same place with the same Filings and Menstruum in it for (if I mis-remember not) a moneth or twotogether ; but observed not, that the liquor would any more grow clear.\n\n**Experiment the Second.**\n\nHaving taken such a Glafs, as is mentioned in Experiment the first, wherein the liquor was grower clearer than is usual, and had probably been so a good while before, (for the Vessel, having been hid by others which stood before it, had been for some weeks forgotten;) We took out the stoptle and left it open for about half an hour, but did not perceive the liquor to have acquired any colour so much as at the top. Whether this proceeded from the long debarring of commerce with the fresh Air, or from some other cause, being unable to wait the event as long as would perhaps be requisite, I thought fit to try, Whether the Air had already had some operation upon the liquor, though it did not yet appear; and accordingly putting in the stoptle, I left the Vessel closed for two or three hours, and at my return to visit it, I perceived, that it had acquired a faint colour tending to a green ; therefore taking out the stoptle again, I open'd its Commerce with the outward Air, leaving the Glafs unstoft for 20 or 24 hours, but found, that in all that time it had not re-gained its wonted dark colour, but was only arrived at a green, deep enough, but not true nor very transparent.\n\n**Experiment the Third.**\n\nThis Observation being made in the same Vessel that had been formerly employed, suggested to us an Enquiry, Whether the advanced time of the year, which was the middle of October, might not have an interest in the flow and imperfect success of this Trial.\n\n**Experiment the Third.**\n\nSome strong Spirit of Salt having been kept upon Filings of Copper till the solution was come to be of a dark brown colour, about three spoonfulfs of it by guess was put into a Receiver that might hold eight or ten times as much : Being kept in vacuo ( if the time be rightly remember’d ) about half a year, it retain’d its colour, but the Vessel being open’d and the External Air permitted a free access to it, the solution in about an hour was turn’d into a fine transparent green, though no Precipitation of any muddy substance appeared by any Sediment to be made.\n\nP pp 2\n\nExpe-\n\n```markdown\n\n(470)\n\nExperiment the Fourth.\n\nIn one of that sort of Conical Glases that has been already more than once describ’d, we had put upon some Filings of Copper- a convenient quantity of our *Spirit of Salt*; and though we observe*d, that for a great while it would not part with its deep and somewhat muddy tincture; yet we left it in the window for many weeks longer, and at length, towards the latter end of December, we found it to have lost its tincture, so much that the liquor appear’d like common water.\n\nUpon which observation, though the time of the year were unpromising, I thought fit to try, whether the Air in that season would not have some, though perhaps but a flow, operation on the Saline Spirit, and accordingly taking out the *Glass-stopp'l’e* to give free access to the outward Air, we observe*d, that in some hours its operation on the liquor was scarce sensible, but within about 24 hours the *Menstruum* had acquired not just its former colour, but a somewhat faint and moderately transparent green: So that this *tined Menstruum*, as it had been very flow in losing its colour, so it did but flowly and imperfectly re-acquire it.\n\n*I have not in the foregoing Experiments made mention of any Phenomena of them relating to the Spring of the included Air, because I do not remember, that they were such as invited me to draw any positive Conclusion from them, and my silence on this occasion may be the more allowable, because the way of further making such Observations may be sufficiently deduc’d from the inusual Tryals; in reciting of which I alter very little, and in some of them not at all, the expressions I find them register’d in, though more than once the Phenomena that relate to the Air’s Elastic power be mingled in the same Experiment with the mention of its operations upon Colours.*\n\nThe Spring of the Air and its variations, by the ways now known to many of the Curious, being things that manifestly appear to have a notable interest in divers Phenomena of Nature, whose Causes, if not themselves also, were unknown to former Philosophers; it seemed an Attempt, though not very promising, yet worth the making, to try whether the Spring of the Air, which may divers ways, as by Heat, Compression, &c. be increas’d, may not by some other way than Gold and Dilatation be weaken’d: And having often found Menstruums that correde Metals, so as to produce bubbles to invigorate the strength\n\nthat correded Metals, so as to produce bubbles to invigorate the strength\n\nof the Spring of the Air included in the Veffels, wherein the solutions was made, I thought fit to try, whether in some metallic Dissolutions, whereby I had observed that few or no visible bubbles at all were produced, the Spring of the neighbouring and included Air would not be debilitated; and in order to this were made the following Trials.\n\nExperiment the Fifth.\n\nE took some Filings of Copper, and putting them together with a Mercurial gage in a Conical Glases fitted with an exactly ground stopple of the same matter, (which was Crystalline) we poured on the Filings as much rectified Spirit of fermented Urin made per se, as sufficed to swim an inch or better above them; then carefully stopping the Glases, coming to look on it many hours after, we perceived that the Mercury in the sealed leg was considerably depr'd, and gently drawing out the stopple to let in the outward Air, we perceived that access to have a manifest effect upon the Mercury. ]\n\nBut this will be better understood by the more Circumstantial Experiment that infues.\n\nExperiment the Sixth.\n\nWe took a Crystal Glase of an almost Conical shape, and capable of containing between five and six ounces of water, and furnished with a stopple of the same matter, that by grinding was exactly fitted to it. Into this we put a convenient quantity of clean Filings of good Copper, on which we poured as much strong Spirit of (fermented, or rather) putif'd Urin, as served to swim about an inch above the Copper, and having let down a Mercurial gage, so that it leaned upon the bottom and side of the Glases, we closed it very well with a stopple, and set it in a quiet and well enlighten'd place, having taken good notice at what mark the Quickfilver rested in the open leg of the Gage. This done, we let the Menstrum alone to work upon the Filings s which it did, as we foreaw, somewhat flowly and very calmly without producing any noise or sentient bubbles, acquiring by degrees a very pleasant blew colour, and the Glases being kept quiet in the same place for two or three daies longer, the liquor, as I conjectured\n\nwould happen, began to lose of the intenseness of its colour, which by degrees grew fainter and fainter, till at the end of three or four daies the liquor was grown very pale, and left me little doubt deed.\n\nIf I would have staid some daies longer, it would have lost the remaining Eye of blows whose colour was suffer'd to deepen for a while longer; so that in less than a quarter of an hour from the first untopping of the Vial, the liquor was grown to be throughout of a rich Ceruleous colour, which grew almost too opacious within a few minutes longer.\n\nWhen carefully closing the Vial again with the same stopple as before, we set it aside in the same place, where, the included Air being denied all Commerce with the External, the liquor began again within two or three daies to lose of its colour; and, to be short, afforded me the opportunity of making a second Experiment, much like the former. And the like success I had, for the main, in a Trial or two made in another Glases with another portion of the same Spirit of Urin, put upon the Filings of Copper, so that the Experiment was, in all, made divers times, as well when I was not, as when I was alone.\n\nAnd particularly, once to be sure that the dilural Air as such had not any great interest in the Phenomenon; I made the Trial successfully about Nine a clock at night in the presence of so well-known a Witness as the Learned Secretary of the Royal Society.\n\nOne Circumstance I forgot to take notice of, which was, that in most of these Experiments I forbore to shake the Glases, left it shoul'd be suspected, that the Agitation of the liquor might have raised some little fine powder that might have been suppos'd to have been precipitated out of the tinture, and, being thus mingled with the liquor again, restore it to its former colour; but in truth I did not perceive any such powder to be precipitated. And though, to obviate the objection, I forbore to shake the Vial;\n\nyet I juftly supposed, that if, by the agitation of the liquor, more parts of it should be quickly exposed to the action of the Air, the Coloriou would be hasten'd,which upon tryal appear'd to be true.\n\nExperiment the Seventh.\n\nExperience having made me think it likely,that strong Spirit of Sal Armoniac, made without Quick-lime, would operate more nimbly and more powerfully on that metal than our Spirit of Urin had done;\n\nwe took such a Conical Glafs, as has been lately described,, and covering the bottom of it with a convenient quantity of Filings of good Copper, we poured on them as much strong Spirit of Sal Armoniac as served to swim about a fingers breadth above them;\n\nand,having let down such a Mercurural Gage as is formerly mentioned, so that it leaned upon the bottom and side of the Glafs, we closed it very well with a stopple and fet in a quiet and well enlighten'd place, having taken good notice at what mark the Quicksilver rested in the open leg of the Gage: This done,we let the Menstruum alone to work upon the Filings,which it did,as we foreaw,somewhat flowly and very calmly,without producing any noise or sensible bubbles,acquiring by degrees a very pleasant blew colour, and afforded us also the Phenomenon we chiefly look after;which was,that repairing from time to time to the window to see what palt,we perceived, that for two or three daies together the Mercury in the seal'd leg of the Gage did,though very flowly,defend till it appear'd to be near a quarter of an inch lower than at first;and probably the depression might have been greater,if some indiscreet body or other had not,by tampering with the Glafs,disturbed the Experiment;whose event yet seemed sufficiently to argue,that the Spring of the Air,contained in the cavity of the Glafs,and communicating with that in the open leg of the Gage or Syphon,was weaken'd in comparison of that in the closed leg,which by the Hermetic Seal on one side,and the Quicksilver on the other side,was kept from such Communication.And because I thought, it might be suspected, that the Phenomenon might be referrable to some Inequality in the pressure of the Air,occasioned by the greater operation of the heat of the day on the more imprifion'd Air of the Gage,than on that more immediately includedin the cavity of the Vial ;I was careful to\n\nobserve, whether the Depression did not continue at differing times of the day, and found it to do so, as we'll at night as at noon, though at this last named time the Sun shined hot upon the place and Veffels too.\n\nThis Experiment was made, in all, four or five times, though not alwaies with equal, yet still with some, success, the Mercury in the seal'd leg of the Gage being sometimes more and sometimes les, but alwaies manifestly defrepit ; which Phenomenon was confirmed by the Observation we more than once made of the sudden return of the Quicksilver to it former station, upon the unstopping of the Glasses, to give free admission to the outward Air.\n\nExperiment the Eighth.\n\nConsidering, whilst I was about these Tryals, that Spirit of Vinegar, though in working upon Coral and some other Bodies it not only produces store of bubbles, but also, as I have elsewhere deliver'd *, a somewhat odd kind of Elastic Substance, yet being put upon Minium it was wont, in my Observation, to work calmly and without producing froath ; I thought fit to make trial, whether this calm and silent solution of Minium would be accompanied with a permanent change of the Air's Spring : The Event I find thus set down :\n\nA Mercurial Gage having been put into a Conical Glass whose bottom was covered with beaten Coral, some Spirit of Vinegar was poured in, and then the Glass flopple, which was very well ground, closing the neck exactly, we observed, that upon the working of the Menstruum on the Coral, store of bubbles were for a good while produced, which successively broke in the cavity of the Veffel, and their accesion so confited the Air, that they comprcss the Air imprison'd in the closed leg of the Gage three marks or Divisions, which I gueffed to amount to about the third part of the extent it had before : But some hours after the Corroson had ceased, the Compression made by this newly generated Air grew manifestly fainter, and the imprison'd Gage-Air drove down the Mercury again till 'twas defrepst within one division of its first station ; and thereabouts, or little lower, continued five or six days ; so that in this operation there seemed to have been a double Compressive Power exercised ; the one transfient, by the brisk agiteration of Vapours or Exhalations, and the other durable, from the Aerial and Springy Particles, either produced or extricated by the action of the Spirit of Vinegar upon the Coral.\n\n[A pretty quantity of Spirit of Vinegar being put upon Minium in a Conical Glass, furnished with a Glass stoffle and a Mercurial Gage, continued divers days without any sense of the Mercury in either leg, nor did any change appear in the the (presumably end of that sentence)\n\nR. R. 656.\n\nthe Gage, upon the removal of the stople, though 'twas evident by the great sweetness acquired, that it had made a Solution of a great portion of the Miniums.']\n\nBut to return to our Trials upon Copper ;\n\nExperiment the Ninth.\n\n[We took some Filings of Copper, and in a Vial capable of holding some two or three Ounces of Water, we poured on them strong Spirit of Sal Armoniac made without Quicklime, till the liquor reached near an Inch above them. This was done about the twentieth of August on the Friday before Noon , and the following Monday presently after Dinner it had acquired a deep Blew tinture, and lost again so much of it, that 'twas pale almost like common water : Then to satisfy a Virtuofo, I unfastop the Vial, defiring him to place his eye level with the surface of the liquor, which in a minute of an hour or less appeared, to his surprise and wonder, to have acquired a deep Blew tinture, that reached downwards to the thicknesses of the back of a knife, the whole liquor becoming of the like Colour in four or five minutes more , and the Glafs being presently stopt again , and left where 'twas before, appeared not at the end of nine daies to have lost its tinture ; though now and then within that time it seemed manifestly paler than when the Vial was stopt.]\n\nN One of the former Trials with Spirit of Sal Armoniac having been made in an Hermetically sealed Glass, it will not be amusing both to diversifie and to confirm our Experimentss, by setting down the successes of one made in such a Vessel:\n\nExperiment the Tenth.\n\n[We took a round Vial holding about eight Ounces of water , and having put into it Filings of Copper and a Mercurial Gage, we poured on the Metal strong Spirit of Sal Armoniac, till it reached to a good height in the Vial, which then being Hermetically sealed up, was set by in a South-window , where it quickly acquired\n\nQ q\n\nquired a deep Blew tinture : There it stood about twelve daies, before that tinture, which decayed but slowly, did little by little grow so diluted that the liquor was pale and almost like water: During this stay of the Glafs in the window, the Mercury in the open leg appeared to be impell'd up, and when after nine a clock at night, (which time I chose to try whether the Nocturnal Air, as Nocturnal, would have any thing to do with the Phaenomenon,) the Hermetic Seal was broken off; immediately upon which there was produced a noise, and the Mercury in the shorter and closed leg was briskly impell'd up, by our guesses, near three eights of an Inch, and though the Orifice at which the Air had access was scarce wide enough to admit a middle seized pea, yet within a minute and half the surface of the liquor being held between the Eye and the Candle, appeared to have acquired a very lovely and fair Colour, which reached downwards a quarter of an Inch; so that the Vial seemed to contain two very differing liquors swimming on one another, and the Coloring piercing deeper and deeper within five Minutes in all, the whole liquor had attained a rich Blew colour.]\n\nWith this Experiment I shall conclude this Paper : For, though I made several other Tryals, with the same design that I made the foregoing ones, as with Spirit of Niter, and Minium, Spirit of Vinegar and Copper;yet a present want of time hinders me from troubling you with them, which I the rather forbear to do, because I fear, they would prove less satisfactory than those I have set down ; which themselves must, to a less discerning eye than yours, appear very imperfect, notwithstanding that prolixity in reciting some of them ; which I was obliged to by my not yet knowing, in such odd attempts, what Circumstances might safely be omitted. But such as they are I send you, who by your diffuse Correspondency have great opportunity to get them made, if you think them ifference betwixt the rebound of those dropt in Vacuo, and those in Air condens'd. I could not observe that the small difference in the weight of the Marbles made any discernable alteration in their Refilitions.\n\nV. An Experiment on the descent of Malt dust in the Evacuated Receiver, at Grefham College. By Mr Fr. Hauksbee.\n\nI Took some Malt dust, and having well dryed the same, put a quantity of it into a fine Muslin Bag, where being loosely inclos'd, would upon shaking discover it self plentifully in the open Air, undulating and floating a considerable time before it would descend ; but being included within a Receiver, from which the Air was well exhausted ; and then shaken, the dust descended as a ponderous Body, precipitating in fraist lines from the top to the bottom of a tall Receiver.\n\nLondon, Printed for Sam. Smith and Benj. Walford, Printers to the Royal Society, at the Princes Arms in St Paul's Church-yard, 1705.\n", "models": {"gemma4e2b": {"source_file": "article.txt", "is_experiment": "yes", "locations": [{"place": "Receiver", "geography": null, "detail": "tall"}, {"place": "Grefham College", "geography": null, "detail": null}, {"place": "St Paul's Church-yard", "geography": "London", "detail": "Princes Arms"}], "_elapsed_s": 16.53}, "llama3.23b": {"source_file": "article.txt", "is_experiment": "yes", "locations": [{"place": null, "geography": null, "detail": null}, {"place": "Grefham College", "geography": "England", "detail": " Evacuated Receiver"}, {"place": null, "geography": "London", "detail": ""}], "_elapsed_s": 9.14}, "ministral33b": {"source_file": "article.txt", "is_experiment": "yes", "locations": [{"place": "Evacuated Receiver", "geography": "Grefham College", "detail": null}], "_elapsed_s": 34.15}, "phi3.5latest": {"source_file": "article.txt", "is_experiment": "yes", "locations": [{"place": "private study or laboratory setting within Grefham College", "geography": "London, England", "detail": null}, {"place": "laboratory setup with a y weaker than crude Sal Ammoniac; which again is somewhat less powerful than\n\nthan Nitre in preserving Flesh. The Nitre was soon opened by the Gall, and emitted a vast Quantity of Air, which rose as from a fermenting Liquor; and when this happened, the Gall began to putrefy. But the saline Mixture generated no Air, and opposed the Putrefaction of Gall more than it did that of Flesh.\n\n3. The last Trial was with the Serum of human Blood, which was preferred by a Decotion of the Bark, and an Infusion of Snake-root, nor with lef Sfficacy than Flesh. But Saffron and Camphire were not here above a fourth Part so antisecptic as before; whether it be that they are lef preservative of this Humour, or, as I suspect, that they were not well mixed. Nitre acted nearly with its full Force, being about four times stronger than Sea-Salt : It generated some Air, but much less than it did with the Gall. No other Humour was tried; but, from these Specimens added to the former Experiments, we may conclude, that whatever is preservative of Flesh will be generally antisecptic, tho' perhaps not always with equal Force.\n\n4. Having already shewn how putrid Flesh might be sweetened, I shall conclude this Part of my Subject with a like Trial upon the Yolk of an Egg. A Portion of this, being diluted with Water, flood till it corrupted; when a few Drops were put into a Phial with two Ounces of pure Water, and about twice as many Drops were mixed with a strong Infusion of Camomile-flowers. At first both Phials had some Degree of a putrid Smell; but being corked, and kept a few Days near a Fire, the Mixture with\n\nplain Water contracted a strong Factor, whilst the other smelled only of the Flowers.\n\nThus far have I related the Experiments made of Antiseptics; by which it appears, that, besides Spirits, Acids, and Salts, we are possessed of many powerful Resifers of Putrefaction, ended with Qualities of heating, cooling, Volatility, Attrition, and the like, which make some more adapted than others to particular Indications.\n\nIn some putrid Cases, many proper Antiseptics are already known; in others they are wanting. We are yet at a Lobs how to correct the Sanies of a cancerous Ulcer; but, from such a Multitude of Antiseptics, it is to be hoped some may be found at last adequate to that Intention. It may be farther remarked, that, as different Dismenides of the putrid kind require different Antiseptics, so the same Dismeneses will not always yield to the same Medicine.\n\nThus the Bark will fail in a Gangrene, if the Veffels are too full, or the Blood fizz: But, if the Veffels are relaxed, and the Blood resolved or dispofed to Putrefaction, either from a bad Habit, or the Absorption of putrid Matter, then is the Bark a good Specific. With the same Caution are we to use it in Wounds; viz. chiefly in Cases of absorbed Matter, which infects the Humours, and induces a hectic Fever. But, when inflammatory Symptoms prevail, the same Medicine increasing the Tension of the Fibres, and Sizinefs of the Blood, a State directly opposed to the other, has such Consequences as might be expected.\n\nBy the Successes of the Bark in so many putrid Cases, it should appear that Attrition had no small Share in the Cure. And indeed the very Nature of Putrefaction\n\nPutrefaction consists in a Separation or Diffusion of the Parts. But as there are other Cafees, in which Aftringency is less wanted, we may find in Contravra-root, Snake-root, Camphire, and other Substances, a highly antiseptic Power, with little or none of the other Quality. And since several of these Medicine are also diaphoretic, their Operation is thereby renderd more successful. I come now to the last thing proposed, which was, to give an Account of some Observations made on Substances haftening or promoting Putrefaction; an Inquiry not les useful than the former. For, setting aside the offensive Idea commonly annexed to the Word, we must acknowledge Putrefaction to be one of the Instruments of Nature, by which many great and curious Changes are brought about. With regard to Medicine, we know, that neither animal nor vegetable Substances can become Aliment, without undergoing some Degree of Putrefaction. Many Distempers proceed from a Deficiency of this Action. The Crises of Fevers seem to depend upon it; and perhaps even animal Heat, according to a late ingenious Theory *. But, in the Prosecution of this Subject, I have met with very few real Septics; and found many Substances, commonly accounted such, of a quite opposite Nature. The most general means of accelerating Putrefaction is, by Heat, Moisture, and stagnant Air; which being sufficiently known and acertained, I paied\n\npafled over, without making any particular Experim-ent on those Heads. Lord Bacon *, as well as some of the Chemifts, has hinted at a putrid Fer-mentation, analogous to what is found in Vegetables; and this having so near a Connection with Contagion, I made the following Experiment, for a further Illustration of this Matter.\n\n5. In the Yolk of an Egg, already putrid, a small Thread was dipped, and a small Bit of this was cut off and put into a Phial, with Half of the Yolk of a new-laid Egg diluted with Water. The other Half, with as much Water, was put into another Phial, and both being corked, were set by the Fire to putrefy. The Result was, that the Thread infected the fresh Yolk ; for the Putrefaction was fooner perceived in the Phial that contained it, than in the other. But this Experiment was not repeated.\n\nIn this manner the Putrefaction of Meat advances quicker in a confined than a free Air; for, as the most putrid Parts are also the most fugitive; they incessantly insuffc from a corruptible Substance, and disperse with the Wind; but in a Stagnation of Air, they remain about the Body; and by way of Fer-ment excite it to Corruption.\n\n6. As for other Septics, recited by Authors, I found none of them answer the Purpose. The al-caline Salts have been considered as the chief Putrefiers. But this is disproved by Experiments. Of the Volatilites it may be indeed observed, that, tho' they preserve from the common Marks of Putrefaction, with\n\nVide Nat. Hif. Cent. IV. Exper. 330.\n\nwith a Force four times greater than that of Sea Salt; yet, in warm Infusions, a small Quantity of these Salts will soften and resolve the Fibres, more than Water does by itself. They also hinder the Coagulation of Blood; and when taken by way of Medicine, thin and resolve it, but are not therefore Septics. For, so little do these Salts putrefy, or even resolve the Fibres, when applied dry, that I have kept, since the Beginning of june last, notwithstand-ing the excesive Heats, a small Piece of Flesh in a Phial, preserved only with Salt of Hartthorn, at present perfectly sound, and firmer than when first salted.\n\n7. From the Specimens we had of the antiforbutic Plants, it is likewise probable none of that Tribe will prove septic. Horse-radish, one of the most acrid, is a very powerful Antiseptic. And tho' Carrots, Turneps, Garlick, Onions, Celery, Cabbage, and Colewort, were tried (as Alcarecents) they did not hasten, but somewhat retarded, the Putrefaction.\n\n8. The Case was different with such farinaeous Vegetables as were examined; viz. white Bread in Infusion, Decoctions of Flour, Barley, and Oatmeal; for these did not at all retard Putrefaction; but, after it was somewhat advanced, they check'd it, by turning four. By a long Digection the Acidity became considerable; which, by conquering the Putrefency of the Flesh, and generating much Air, did not ill represent the State of weak Bowels, which convert Bread, and the mildest Grains, to such an Acid, as prevents a due Resolution and Digection of animal Food *. 9.\n\n9. I examined *Cantharides*, dried Vipers, and *Russian Castror*, all animal Substances, and therefore most likely to prove septic. The Flies were tried both with fresh Beef, and with the *Serum* of human Blood; the Vipers only with the former; but neither of them haflened Putrefaction. And as for the *Castror*, so far from promoting this Processes, that an Infusion of 12 Grains opposed it more than the standard Salt.\n\n10. After finding no Septics where they were most expected, I discovered some which seemed the least likely; viz. Chalk, the *Tefacea*, and common Salt.\n\nTwenty Grains of Crabs-eyes prepared, were mixed with 6 Drachms of Ox's Gall, and as much Water; into another Phial was put nothing but Gall and Water, in the same Quantity with the former; and both being placed in the Furnace, the Putrefaction began much sooner, where the Powder was, than in the other Phial. I infused afterwards in the Lamp-Furnace 30 Grains of prepared Chalk, with the usual Quantity of Flesh and Water; and observed, that the Corruption not only began sooner, but went higher by this Mixture; nay, what had never happened before, that in a few Days the Flesh re-folved into a perfect Mucus. The Experiment was repeated with the same Effect; which being so extraordinary, I suspect some corrosive Substance had been mixed with the Powder. But, for a Trial, a Lump\n\nCaufe of the Acidity. This kind of Fermentation between animal and vegetable Substances, being hitherto overlooked, shall be therefore set forth in my next Paper.\n\nof Chalk being pounded, 30 Grains of it proved fully as septic as the former. The same Powder was compared with an equal Quantity of Salt of Wormwood, and Care was taken to shake both the Mixtures alike: But, after three Days warm Digeition, the Salt had neither tainted nor soften'd the Flesh, whilst the Chalk had rotted and consumed that which was joined to it. Nor were the Effects left of the terrificous Powders of the Dispensary. Egg-shells in Water resisted Putrefaction, and preserved the Meat longer firm than plain Water *.\n\n11. To try whether the Tectace would also dissolve vegetable Substances, I infused them with Barley and Water, and compared this Mixture with another of Barley and Water, without the Tectace. After a long Maceration by a Fire, the plain Water swelled the Barley, became mucilaginous and four; but that with the Powder kept the Grain to its natural Size, tho' it softened it, made no Mucilage, and remained sweet.\n\n12. Nothing could be more unexpected than to find Sea Salt a Haf'tener of Putrefaction. But the Fact is thus. One Drachm of Salt preserves two Drachms of fresh Beef, in two Ounces of Water, above 30 Hours, uncorrupted, in a Heat equal to that of the human Body; or, what amounts to the same, this Quantity of Salt keeps Flesh about 20 Hours longer sweet, than pure Water; but half a Drachm of Salt does not preserve it above 2 Hours longer. This Experiment has been already mentioned.\n\n*\n\nThe Trial was made with a coarse Powder, of this Substance, but not repeated.\n\nrioned. Now I have since found, that 25 Grains have little or no antiseptic Virtue; and that 10, or 15, or even 20 Grains manifeably both hasten and heighten the Corruption*. It is moreover to be remarked, that in warm Infusions with these smaller Quantities, the Salt, instead of hardening the Flesh, as it does in a dry Form, in Brine, or even in Solutions, such as our Standard, it here softens and re-laxes the Texture of the Meat, more than plain Water; tho' much less than Water with Chalk, or the testac- cous Powders.\n\nMany Inferences might be made from this Experiment; but I shall only mention one. Salt, the indispensable Seasoner of animal Food, has been supposed to act by an antiseptic Quality, correcting the too great Tendency of Meats to Putrefaction. But, since it is never taken in Aliment beyond the Proportion of the corrupting Quantities in our Experient, it would appear that Salt is sub-ervient to Digestion, chiefly by a scptic Virtue; that is, by softening and re-folving Meats; an Action very different from what is commonly believed.\n\nVI.\n\n---\n\n* See this Transaction, p. 525, &c.\n\n* An Essay on the Caufe of animal Heat, by f. Stevenson, M.D. Vide Medical Essays, Vol. V.\n\n* It is to be remarked, that, in making this Experiment, I did not then attend to a Fermentation that enfued, and which was the *Cause*\n\n* The most putrefying Quantity of Salt, with this Proportion of Salt and Water, is about 10 Grains.\n", "models": {"gemma4e2b": {"source_file": "article.txt", "is_experiment": "yes", "locations": [{"place": "private setting (implied)", "geography": null, "detail": null}], "_elapsed_s": 38.88}, "llama3.23b": {"source_file": "article.txt", "experiments": [{"reasoning": "This counts as an experiment because it involves testing a specific substance's effect on putrefaction.", "description": "Decoctions of Wormwood and Bark, Infusions of Chamomile-flowers, and preserved Yolks of Eggs were tested with Sea-Salt. The results showed that the combination of these substances was more effective than using just Sea-Salt alone.", "quote": "\"the Decoctions of Wormwood and the Bark, as well as the Infusions of Chamomile-flowers, and the preserved Yolks of Eggs, not only several Days longer than Water did alone, but also when a good Quantity of Sea-Salt was added to it.\"", "outcome": "Preserved for several days longer than with just Sea-Salt.", "location": "", "individuals": [""]}, {"reasoning": "This counts as an experiment because it involves testing the effect of different substances on putrefaction.", "description": "Ox's Gall was kept from putrefaction with small quantities of various substances, including Lye of Tartar, Spirit of Hartshorn, crude Sal Ammoniac, and saline Mixture. The results showed that some substances were more effective than others in preventing putrefaction.", "quote": "\"the Ox's Gall was kept some time from Putrefaction by small Quantities of Lye of Tartar, Spirit of Hartshorn, crude Sal Ammoniac, and the saline Mixture, and still longer by a Decoction of Wormwood, Infusions of Chamomile-flowers, and of Snake-root\"", "outcome": "Prevented putrefaction for a longer period.", "location": "" ption).", "location": "null", "individuals": ["John Pringle M. D. F. R. S."]}], "_elapsed_s": 261.05}}}, "1291946": {"article_text": "```html\n\n<div class=\"text-block\">\n\n<div class=\"text-container\">\n\n[ 300 ]\n\n</div>\n\n<div class=\"text-block\">\n\n<div class=\"text-line\">LI. Electrical Experiments, made in pur-\n\n<div class=\"text-line\">suance of those by Mr. Canton, dated\n\n<div class=\"text-line\">Decem. 3, 1753; with Explanations by\n\n<div class=\"text-line\">Mr. Benjamin Franklin, Communicated\n\n<div class=\"text-line\">Mr. Peter Collinfon, F. R. S.\n\n</div>\n\n<div class=\"text-line\">Philadelphia, March 14, 1755.\n\n<div class=\"text-line\">Principles.\n\n</div>\n\n</div>\n\n<div class=\"text-block\">\n\nRead Dec. 18, I. E Le\n\n<div class=\"text-line\">lectric atmospheres, that flow round\n\n<div class=\"text-line\">non-\n\n<div class=\"text-line\">electric bodies, being brought near each other, do not readily mix and unite into one atmosphere, but remain separate, and repel each other.\n\n<div class=\"text-line\">\n\nThis is plainly seen in suspended cork balls, and other bodies electrified.\n\n</div>\n\n</div>\n\n<div class=\"text-block\">\n\nII. An electric atmosphere not only repels another electric atmosphere, but will also repel the electric matter contained in the substance of a body\n\n<div class=\"text-line\">approaching it; and without joining or mixing with it, force it to other parts of the body, that contained it.\n\n</div>\n\n<div class=\"text-line\">\n\nThis is shown by some of the following experiments.\n\n</div>\n\n</div>\n\n<div class=\"text-block\">\n\nIII. Bodies electrified negatively, or deprived of their natural quantity of electricity, repel each other,\n\n<div class=\"text-line\">(or at least appear to do so, by a mutual receding) as well as those electrified positively, or which have\n\n<div class=\"text-line\">electric atmospheres.\n\n</div>\n\n</div>\n\n<div class=\"text-block\">\n\nThis is shown by applying the negatively charged wire of a phial to two cork balls, suspended by silk threads, and by many other experiments.\n\n</div>\n\n<div class=\"text-block\">\n\nPrepa\n\n</div>\n\n</div>\n\n```\n\nPreparation.\n\nFix a tassel of 15 or 20 threads, 3 inches long, at one end of a tin prime conductor; (mine is about 5 feet long, and 4 inches diameter), supported by silk lines. Let the threads be a little damp, but not wet.\n\nExperiment I.\n\nPafs an excited glafs tube near the other end of the prime conductor, so as to give it some sparks, and the threads will diverge.\n\nBecause each thread, as well as the prime conductor, has acquired an elastic atmosphere, which repels, and is repelled by, the atmospheres of the other threads: if those several atmospheres would readily mix, the threads might unite, and hang in the middle of one atmosphere, common to them all.\n\nRub the tube afresh, and approach the prime conductor therewith, crosways, near that end, but nigh enough to give sparks; and the threads will diverge a little more.\n\nBecause the atmosphere of the prime conductor is prefied by the atmosphere of the excited tube, and driven towards the end where the threads are, by which each thread acquires more atmosphere.\n\nWithdraw the tube, and they will close as much.\n\nThey close as much, and no more, because the atmosphere of the glafs tube, not having mix'd with the atmosphere of the prime conductor, is withdrawn\n\nintire, having made no addition to, or diminution from, it.\n\nBring the excited tube under the tuft of threads, and they will close a little.\n\nThey close, because the atmosphere of the glafs tube repels their atmospheres, and drives part of them back on the prime conductor.\n\nWithdraw it, and they will diverge as much.\n\nFor the portion of atmosphere, which they had loft, returns to them again.\n\nExperiment II.\n\nExcite the glafs tube, and approach the prime conductor with it, holding it across near the opposite end, to that on which the threads hang, at the distance of 5 or 6 inches. Keep it there a few seconds, and the threads of the tausils will diverge. Withdraw it, and they will close.\n\nThey diverge, because they have received electric atmospheres from the electric matter contained in the substance of the prime conductor; but which is now repelled and driven away, by the atmosphere of the glafs tube, from the parts of the prime conductor, opposite and nearest to that atmosphere, and forced out upon the surface of the prime conductor at its other end, and upon the threads hanging thereto. Were it any part of the atmosphere of the glafs tube, that flowed over and along the prime conductor to the threads, and gave them atmospheres (as in the cafe when a spark is given to the prime conductor, from the glafs tube), such part of the\n\ntube's atmosphere would have remained, and the threads continue to diverge; but they close on with-drawing the tube, because the tube takes with it all its own Atmosphere, and the electric matter, which had been driven out of the substance of the prime conductor, and formed atmospheres round the threads, is thereby permitted to return to its place.\n\nTake a spark from the prime conductor, near the threads, when they are diverged as before, and they will close.\n\nFor by so doing you take away their atmospheres, composed of the electric matter driven out of the substance of the prime conductor, as aforesaid, by the repelling of the atmosphere of the glafs tube. By taking this spark you rob the prime conductor of part of its natural quantity of the electric matter; which part so taken is not supplied by the glafs tube, for when that is afterwards withdrawn, it takes with it its whole atmosphere, and leaves the prime conductor electrified negatively, as appears by the next operation.\n\nThen withdraw the tube, and they will open again.\n\nFor now the electric matter in the prime conductor, returning to its equilibrium, or equal diffusion, in all parts of its substance, and the prime conductor having lost some of its natural quantity, the threads connected with it lose part of theirs, and so are electrified negatively, and therefore repel each other, by Pr. III.\n\nApproach the prime conductor with the tube near the same place as at first, and they will close again.\n\nBecause the part of their natural quantity of electric fluid, which they had lost, is now restored to them again, by the repulsion of the gla... forcing that fluid to them from other parts of the prime conductor : so they are now again in their natural state.\n\nWithdraw it, and they will open again.\n\nFor what had been restored to them is now taken from them again, flowing back into the prime conductor, and leaving them once more electrified negatively.\n\nBring the excited tube under the threads, and they will diverge more.\n\nBecause more of their natural quantity is driven from them into the prime conductor, and thereby their negative electricity increased.\n\nExperiment III.\n\nThe prime conductor not being electrified, bring the excited tube under the t..., and the threads will diverge.\n\nPart of their natural quantity is thereby driven out of them into the prime conductor, and they become negatively electrified, and therefore repel each other.\n\nKeeping the tube in the same place with one hand, attempt to touch the threads with the finger of the other hand, and they will recede from the finger.\n\nBecause the finger being plunged into the atmosphere of the gla... part of its natural quantity is driven back through the hand 8\n\nhand and body, by that atmosphere, and the finger becomes, as well as the threads, negatively electrified, and so repels, and is repelled by them. To confirm this, hold a slender light lock of cotton, two or three inches long, near a prime conductor, that is electrified by a glass globe, or tube. You will see the cotton stretch itself out towards the prime conductor. Attempt to touch it with the finger of the other hand, and it will be repelled by the finger. Approach it with a positively charged wire of a bottle, and it will fly to the wire. Bring near it a negatively charged wire of a bottle, it will recede from that wire in the same manner, that it did from the finger; which demonstrates the finger to be negatively electrified, as well as the lock of cotton so situated.\n\nLII. Extract of a Letter concerning Electricity, from Mr. B. Franklin to Monf. Dedilibard, inclosed in a Letter to Mr. Peter Collinson, F. R. S.\n\nPhiladelphia, June 29, 1755. Read Dec. 18, Y O U defire my opinion of Pere Becar... VOL. 49. R r\n\nwater-\n", "models": {"gemma4e2b": {"source_file": "article.txt", "is_experiment": "yes", "locations": [{"place": "Philadelphia", "geography": "Philadelphia, United States", "detail": null}], "_elapsed_s": 23.95}, "llama3.23b": {"source_file": "article.txt", "is_experiment": "yes", "locations": [{"place": "private study", "geography": null, "detail": null}, {"place": "kitchen", "geography": null, "detail": null}], "_elapsed_s": 41.95}, "ministral33b": {"source_file": "article.txt", "is_experiment": "yes", "locations": [{"place": "laboratory setup involving a tin prime conductor (5 feet long, 4 inches diameter) supported by silk lines", "geography": "Philadelphia", "detail": "experimental apparatus in a room where glass tubes are excited to produce sparks near the conductor"}], "_elapsed_s": 37.64}, "phi3.5latest": {"source_file": "article.txt", "is_experiment": "yes", "locations": [{"place": "private study/laboratory (not specified at room or building scale)", "geography": "Philadelphia, Pennsylvania, USA", "detail": null}], "_elapsed_s": 58.07}, "qwen3.52b": {"source_file": "article.txt", "is_experiment": "yes", "locations": [], "_elapsed_s": 123.91}, "qwen3.54b": {"source_file": "article.txt", "is_experiment": "yes", "locations": [{"place": null, "geography": "Philadelphia", "detail": null}], "_elapsed_s": 115.37}}}};

    else if (i === 1 && slugs.length > 1) sel.value = slugs[1];
  });
}

function renderArticle(jstor_id) {
  document.getElementById('article-text').textContent =
    DATA[jstor_id].article_text;
}

function renderExperiments(jstor_id, slug, containerId, headId) {
  const container = document.getElementById(containerId);
  const head = document.getElementById(headId);
  const models = DATA[jstor_id].models;
  if (!models[slug]) { container.innerHTML = '<p class="empty">No data</p>'; return; }
  const payload = models[slug];
  const isXp = payload.is_experiment || '—';
  const locs = payload.locations || [];
  head.textContent = SLUG_LABELS[slug] || slug;

  const badgeColor = isXp === 'yes' ? '#3a7d44' : isXp === 'no' ? '#a33' : '#888';
  let html = `<div style="margin-bottom:0.75rem">
    <span style="display:inline-block;background:${badgeColor};color:#fff;
      border-radius:4px;padding:0.2rem 0.6rem;font-size:0.82rem;font-weight:600;">
      Experiment: ${esc(isXp)}
    </span>
  </div>`;

  if (!locs.length) {
    html += '<p class="empty">No locations extracted.</p>';
  } else {
    html += locs.map((loc, i) => {
      const parts = [loc.place, loc.geography, loc.detail].filter(Boolean).map(esc);
      return `<div class="xp-card">
        <h4>Location ${i + 1}</h4>
        <div class="xp-field">
          ${parts.join('<span style="color:#bbb"> · </span>') || '<em style="color:#999">—</em>'}
        </div>
        ${loc.place ? `<div class="xp-field"><strong>Place</strong>${esc(loc.place)}</div>` : ''}
        ${loc.geography ? `<div class="xp-field"><strong>Geography</strong>${esc(loc.geography)}</div>` : ''}
        ${loc.detail ? `<div class="xp-field"><strong>Detail</strong>${esc(loc.detail)}</div>` : ''}
      </div>`;
    }).join('');
  }
  container.innerHTML = html;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const id = selArticle.value;
  renderArticle(id);
  renderExperiments(id, selA.value, 'xp-a', 'head-a');
  renderExperiments(id, selB.value, 'xp-b', 'head-b');
}

selArticle.addEventListener('change', () => {
  populateModelSelects(selArticle.value);
  render();
});
selA.addEventListener('change', render);
selB.addEventListener('change', render);

// Init
populateModelSelects(articles[0]);
render();
</script>
</body>
</html>
